[project]
name = "factory-dashboard"
version = "0.1.0"
description = "Read-model web app + grounded delivery-status chat over the factory bus and forge durable state. Projection-not-participant: reads only, writes nothing in v1."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.18",
    "nats-py>=2.15.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "mypy>=1.14",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

# This is an application, not a distributable library: no build backend, no wheel.
# `backend` is imported from the repo root (see tool.pytest / tool.mypy below).
[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PL", "RUF"]
ignore = [
    "PLR2004", # magic values are fine in view-model fixtures/tests
    "PLR0913", # view models legitimately carry many fields
    "C408",    # dict(panel_id=..., title=...) reads more clearly than a brace literal here
    "RUF001",  # en-dashes / ⟨⟩ glyphs are the spec's own vocabulary (norm bands "2–3", ids ⟨FEAT-x⟩)
    "RUF002",  # same, in docstrings
    "RUF003",  # same, in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
files = ["backend", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
