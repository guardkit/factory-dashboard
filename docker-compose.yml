# The factory dashboard: one image, two containers.
#
#   board  — the web pages and the chat, on 127.0.0.1:8090 (loopback only; nothing is published). The
#            chat calls LiteLLM on :4000 with its own key (FACTORY_DASH_CHAT_KEY, from ./.env).
#   projector ("the feed") — copies Forge's build record into ./data every 15 s, read-only, and checks the model
#            gateway, the model server and the bus monitor every 30 s. No bus connection.
#
# Start (or restart after a rollout):  deploy/dashboard-up.sh   (see docs/runbook.md)
#
# network_mode: host, so the feed reaches the estate's loopback services (LiteLLM :4000,
# llama-swap :9000, the NATS monitor :8222) and the board binds 127.0.0.1:8090 itself.
#
# The store lives on ./data (a bind mount), so recreating the containers keeps it; it is also
# disposable — delete it and the feed rebuilds it from Forge's record. Forge's record is mounted
# READ-ONLY and opened read-only (URI mode=ro). Both containers create the store's tables at start,
# so they can start in either order. `restart: unless-stopped` brings both back after a reboot.

services:
  board:
    build: .
    image: factory-dashboard:local
    command: ["uvicorn", "backend.app:app", "--host", "127.0.0.1", "--port", "8090"]
    network_mode: host
    user: "${FACTORY_UID:-1000}:${FACTORY_GID:-1000}"
    environment:
      FACTORY_DASH_DB: /data/readmodel.db
      FACTORY_DASH_CONFIG_DIR: /config
      # The chat's own LiteLLM key, limited to the `dashboard-chat` model name. Compose reads it from
      # ./.env (gitignored, mode 600 — see .env.example), the same file the feed uses; only this one
      # value is passed, so the board never holds the file's other logins. Empty: the chat says it
      # is not switched on, and the pages work as before.
      FACTORY_DASH_CHAT_KEY: ${FACTORY_DASH_CHAT_KEY:-}
    volumes:
      - ./data:/data
      # Accounts and the session secret (README "Accounts and access"), outside the repository,
      # read-only. The board refuses to start without them; compose refuses if the folder is
      # missing (rather than creating an empty root-owned one).
      - type: bind
        source: ${FACTORY_DASH_CONFIG_DIR:-~/.config/factory-dashboard}
        target: /config
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  projector:
    build: .
    image: factory-dashboard:local
    command: ["python", "-m", "backend.projector"]
    network_mode: host
    user: "${FACTORY_UID:-1000}:${FACTORY_GID:-1000}"
    # ./.env (gitignored, mode 600 — see .env.example) carries the dashboard's own LiteLLM key for
    # the models-list health check. Nothing else.
    env_file: .env
    environment:
      FACTORY_DASH_DB: /data/readmodel.db
      FACTORY_FORGE_DB_PATH: /forge-state/forge.db
    volumes:
      - ./data:/data
      # Forge's live build record (the estate's ledger volume), read-only. SQLite can read a WAL
      # database from a read-only mount while Forge holds it open (its -wal and -shm files exist).
      # While Forge is stopped the reader cannot open it; the pages then show the stale-data banner.
      - forge-ledger:/forge-state:ro
    restart: unless-stopped

volumes:
  forge-ledger:
    external: true
    name: ${FACTORY_FORGE_LEDGER_VOLUME:-forge-estate_forge-ledger}
